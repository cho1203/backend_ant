<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANT TOGETHER - 비밀번호 재설정</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <img src="{{ url_for('static', filename='images/ant-icon.png') }}" alt="ant" class="ant-image">
    
    <h2 class="page-title">비밀번호 재설정</h2>
    <p class="page-info">새로운 비밀번호를 입력해주세요.</p>
    
    <!-- Flash 메시지 표시 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    
    <form method="POST">
      <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" name="new_password" placeholder="새 비밀번호 (8자 이상, 영문+숫자+특수문자)" required>
      </div>
      
      <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" name="confirm_password" placeholder="새 비밀번호 확인" required>
      </div>
      
      <button type="submit" class="login-btn">비밀번호 변경</button>
    </form>
    
    <div class="back-link">
      <a href="{{ url_for('auth.login') }}">로그인 페이지로 돌아가기</a>
    </div>
  </div>
  
  <style>
    .page-title {
      color: #fff;
      font-size: 1.8rem;
      margin: 20px 0 10px;
      font-weight: bold;
      text-align: center;
    }
    
    .page-info {
      color: #aaa;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    
    .flash-messages {
      margin: 10px 0;
      width: 90%;
    }
    
    .flash-message {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .back-link {
      margin-top: 30px;
    }
    
    .back-link a {
      color: #aaa;
      text-decoration: underline;
      font-size: 0.85rem;
    }
  </style>
</body>
</html>
