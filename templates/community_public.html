<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, initial-scale=1.0">
  <title>{{ board_name }} - Ssamsing Community</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/community_public_style.css') }}">
  <style>
    /* 기본 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #000;
      color: white;
      max-width: 393px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }
    
    .container {
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* 헤더 */
    .header {
      background: #000;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #333;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 5px;
    }
    
    .header-title {
      font-size: 16px;
      font-weight: 600;
    }
    
    .header-menu {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 5px;
    }
    
    /* 게시판 타이틀 */
    .board-header {
      padding: 15px 20px;
      border-bottom: 1px solid #333;
    }
    
    .board-title {
      font-size: 18px;
      font-weight: bold;
    }
    
    /* 게시글 영역 */
    .post-area {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    
    .post-header {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
    }
    
    .post-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    
    .post-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #999;
    }
    
    .post-author {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .author-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }
    
    .post-content {
      margin: 20px 0;
      line-height: 1.6;
      font-size: 15px;
    }
    
    /* 액션 버튼들 */
    .post-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      margin: 20px 0;
    }
    
    .action-left {
      display: flex;
      gap: 20px;
    }
    
    .action-btn {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      padding: 5px;
    }
    
    .action-btn:hover {
      color: white;
    }
    
    .action-btn.liked {
      color: #ff6b35;
    }
    
    .bookmark-btn.bookmarked {
      color: #ffd700;
    }
    
    /* 댓글 영역 */
    .comments-section {
      margin-top: 20px;
    }
    
    .comments-header {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
    }
    
    .comment-item {
      background: #111;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #222;
    }
    
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .comment-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .comment-author-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }
    
    .comment-author-name {
      font-size: 13px;
      font-weight: 600;
    }
    
    .comment-actions {
      display: flex;
      gap: 10px;
    }
    
    .comment-like-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    
    .comment-like-btn.liked {
      color: #ff6b35;
    }
    
    .comment-delete-btn {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      font-size: 11px;
    }
    
    .comment-content {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    
    .comment-time {
      font-size: 11px;
      color: #666;
    }
    
    /* 댓글 입력 영역 */
    .comment-input-area {
      position: sticky;
      bottom: 0;
      background: #000;
      padding: 15px 20px;
      border-top: 1px solid #333;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    
    .comment-input-user {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    
    .comment-input {
      flex: 1;
      background: #222;
      border: 1px solid #444;
      border-radius: 20px;
      padding: 10px 15px;
      color: white;
      font-size: 14px;
    }
    
    .comment-input::placeholder {
      color: #666;
    }
    
    .comment-submit {
      background: #4CAF50;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 35px;
      height: 35px;
    }
    
    .comment-submit:hover {
      background: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 헤더 -->
    <header class="header">
      <button class="back-btn" onclick="goBack()">←</button>
      <div class="header-title">Ssamsing community</div>
      <button class="header-menu">☰</button>
    </header>
    
    <!-- 게시판 헤더 -->
    <div class="board-header">
      <div class="board-title">{{ board_name or '비밀게시판' }}</div>
    </div>
    
    <!-- 게시글 영역 -->
    <div class="post-area">
      <!-- 게시글 헤더 -->
      <div class="post-header">
        <div class="post-title" id="postTitle">집밥 너 가쳐서 받다가 수요 됐는 질문게...</div>
        <div class="post-meta">
          <div class="post-author">
            <div class="author-icon">익명</div>
            <span>익명1</span>
          </div>
          <span>08/1 3:38</span>
        </div>
      </div>
      
      <!-- 게시글 내용 -->
      <div class="post-content" id="postContent">
        집밥 너 가쳐서 받다가 수요 됐는 질문게 3초요 너다 너들끼 리... 집밥도 볼 어끼여구 저기... 캠과 정 장감시, 가족 이별느 물검.
      </div>
      
      <!-- 액션 버튼 -->
      <div class="post-actions">
        <div class="action-left">
          <button class="action-btn like-btn" id="postLikeBtn" onclick="togglePostLike()">
            👍 <span id="postLikeCount">3</span>
          </button>
          <button class="action-btn" onclick="scrollToComments()">
            💬 <span id="commentCount">1</span>
          </button>
        </div>
        <button class="action-btn bookmark-btn" id="bookmarkBtn" onclick="toggleBookmark()">
          🔖
        </button>
      </div>
      
      <!-- 댓글 섹션 -->
      <div class="comments-section" id="commentsSection">
        <div class="comments-header">댓글 <span id="commentCountText">1</span>개</div>
        
        <div class="comments-list" id="commentsList">
          <!-- 기본 댓글 -->
          <div class="comment-item">
            <div class="comment-header">
              <div class="comment-author">
                <div class="comment-author-icon">익명</div>
                <div class="comment-author-name">익명1</div>
              </div>
              <div class="comment-actions">
                <button class="comment-like-btn" onclick="toggleCommentLike(this)">
                  👍 <span>0</span>
                </button>
                <button class="comment-delete-btn" onclick="deleteComment(this)">×</button>
              </div>
            </div>
            <div class="comment-content">일으닉 가끔 졸어걸읺니 숫 추객곳이어 모르꺽습니... 같은 이씁 숟늘년니닥 잠객다 잠</div>
            <div class="comment-time">12월 전</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 댓글 입력 영역 -->
    <div class="comment-input-area">
      <div class="comment-input-user">익명</div>
      <input type="text" class="comment-input" id="commentInput" placeholder="댓글을 입력하세요...">
      <button class="comment-submit" onclick="addComment()">▶</button>
    </div>
  </div>
  
  <script>
    // 전역 변수
    let postLiked = false;
    let bookmarked = false;
    
    // 뒤로 가기
    function goBack() {
      console.log('🔙 뒤로 가기');
      history.back();
    }
    
    // 게시글 좋아요 토글
    function togglePostLike() {
      const likeBtn = document.getElementById('postLikeBtn');
      const likeCount = document.getElementById('postLikeCount');
      let count = parseInt(likeCount.textContent);
      
      if (!postLiked) {
        count += 1;
        likeBtn.classList.add('liked');
        postLiked = true;
        console.log('👍 게시글 좋아요');
      } else {
        count -= 1;
        likeBtn.classList.remove('liked');
        postLiked = false;
        console.log('👍 게시글 좋아요 취소');
      }
      
      likeCount.textContent = count;
    }
    
    // 북마크 토글
    function toggleBookmark() {
      const bookmarkBtn = document.getElementById('bookmarkBtn');
      
      if (!bookmarked) {
        bookmarkBtn.classList.add('bookmarked');
        bookmarked = true;
        console.log('🔖 북마크 추가');
      } else {
        bookmarkBtn.classList.remove('bookmarked');
        bookmarked = false;
        console.log('🔖 북마크 제거');
      }
    }
    
    // 댓글로 스크롤
    function scrollToComments() {
      document.getElementById('commentsSection').scrollIntoView({ behavior: 'smooth' });
    }
    
    // 댓글 추가
    function addComment() {
      const input = document.getElementById('commentInput');
      const commentText = input.value.trim();
      
      if (commentText === '') return;
      
      const commentsList = document.getElementById('commentsList');
      const commentCount = document.getElementById('commentCount');
      const commentCountText = document.getElementById('commentCountText');
      
      // 새 댓글 생성
      const commentItem = document.createElement('div');
      commentItem.className = 'comment-item';
      commentItem.innerHTML = `
        <div class="comment-header">
          <div class="comment-author">
            <div class="comment-author-icon">익명</div>
            <div class="comment-author-name">익명</div>
          </div>
          <div class="comment-actions">
            <button class="comment-like-btn" onclick="toggleCommentLike(this)">
              👍 <span>0</span>
            </button>
            <button class="comment-delete-btn" onclick="deleteComment(this)">×</button>
          </div>
        </div>
        <div class="comment-content">${commentText}</div>
        <div class="comment-time">방금 전</div>
      `;
      
      commentsList.appendChild(commentItem);
      input.value = '';
      
      // 댓글 수 업데이트
      const newCount = parseInt(commentCount.textContent) + 1;
      commentCount.textContent = newCount;
      commentCountText.textContent = newCount;
      
      console.log('💬 댓글 추가:', commentText);
    }
    
    // 댓글 좋아요 토글
    function toggleCommentLike(button) {
      const countSpan = button.querySelector('span');
      let count = parseInt(countSpan.textContent);
      
      if (!button.classList.contains('liked')) {
        count += 1;
        button.classList.add('liked');
        console.log('👍 댓글 좋아요');
      } else {
        count -= 1;
        button.classList.remove('liked');
        console.log('👍 댓글 좋아요 취소');
      }
      
      countSpan.textContent = count;
    }
    
    // 댓글 삭제
    function deleteComment(button) {
      const commentItem = button.closest('.comment-item');
      const commentCount = document.getElementById('commentCount');
      const commentCountText = document.getElementById('commentCountText');
      
      commentItem.remove();
      
      // 댓글 수 업데이트
      const newCount = Math.max(0, parseInt(commentCount.textContent) - 1);
      commentCount.textContent = newCount;
      commentCountText.textContent = newCount;
      
      console.log('🗑️ 댓글 삭제');
    }
    
    // Enter 키로 댓글 등록
    document.getElementById('commentInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addComment();
      }
    });
    
    // 페이지 로드 완료
    console.log('✅ 게시글 상세 페이지 로드 완료');
  </script>
</body>
</html>
