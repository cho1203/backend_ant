<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat UI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat_engine_style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-container">
    
    <!-- 상단 영역 -->
    <div class="top-bar">
      <div class="profile-icon"></div>
      <button class="new-button">New</button>
    </div>

    <!-- 메시지 출력 영역 -->
    <div class="chat-box" id="chatBox">
      <div class="message user-message">
        <div class="message-content">WELCOME ANT TOGETHER CHAT AI</div>
        <div class="ai-icon"></div>
      </div>
    </div>

    <!-- 하단 입력 영역 -->
    <div class="chat-input">
      <button class="plus-button" id="plusButton">+</button>
      <input type="text" id="chatInput" placeholder="Type your message here..." />
      <button class="send-button" id="sendButton">➤</button>
    </div>

  </div>

  <!-- 이미지 업로드 팝업 -->
  <div class="image-popup" id="imagePopup">
    <div class="popup-content">
      <label class="upload-label" for="imageInput">사진 업로드</label>
      <input type="file" id="imageInput" accept=".png,.jpg,.jpeg" hidden />
      <button class="image-send-button" id="imageSendButton">⬆️</button>
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const chatInput = document.querySelector('.chat-input input');
  const sendBtn = document.querySelector('.send-button');
  const chatBox = document.querySelector('.chat-box');
  const plusBtn = document.querySelector('.plus-button');
  const imageInput = document.getElementById('imageInput');
  const imageSendBtn = document.querySelector('.image-send-button');
  const imagePopup = document.getElementById('imagePopup');
  const newButton = document.querySelector('.new-button');

  function sendMessage(text) {
    if (!text.trim()) return;

    const message = document.createElement('div');
    message.className = 'message user-message';

    const icon = document.createElement('div');
    icon.className = 'user-icon';
    const content = document.createElement('div');
    content.className = 'message-content';
    content.innerText = text;

    message.appendChild(content);
    message.appendChild(icon);
    chatBox.appendChild(message);
    chatBox.scrollTop = chatBox.scrollHeight;
    chatInput.value = '';

    // 🔧 AI 응답 요청
    fetch("/api/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ message: text }),
    })
      .then((res) => res.json())
      .then((data) => {
        console.log("💬 AI 응답:", data);
        const aiReply = document.createElement('div');
        aiReply.className = 'message ai-message';

        const aiIcon = document.createElement('div');
        aiIcon.className = 'ai-icon';

        const replyContent = document.createElement('div');
        replyContent.className = 'message-content';

        if (data.reply) {
          replyContent.innerText = data.reply;
        } else if (data.error) {
          replyContent.innerText = "❌ 오류: " + data.error;
        } else {
          replyContent.innerText = "⚠️ 알 수 없는 응답입니다.";
        }

        aiReply.appendChild(aiIcon);
        aiReply.appendChild(replyContent);
        
        chatBox.appendChild(aiReply);
        chatBox.scrollTop = chatBox.scrollHeight;
      })
      .catch((error) => {
        console.error("AI 응답 오류:", error);

        const aiReply = document.createElement('div');
        aiReply.className = 'message ai-message';
        const aiIcon = document.createElement('div');
        aiIcon.className = 'ai-icon';
        const replyContent = document.createElement('div');
        replyContent.className = 'message-content';
        replyContent.innerText = "❌ 서버 요청 중 오류가 발생했습니다.";
        aiReply.appendChild(aiIcon);
        aiReply.appendChild(replyContent);
        chatBox.appendChild(aiReply);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
  }

  // 이벤트 리스너
  sendBtn.addEventListener('click', () => {
    sendMessage(chatInput.value);
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage(chatInput.value);
  });

  plusBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    imagePopup.classList.add('show');
  });

  document.addEventListener('click', (e) => {
    if (!imagePopup.contains(e.target) && !plusBtn.contains(e.target)) {
      imagePopup.classList.remove('show');
    }
  });

  // New 버튼 - 채팅 초기화
  newButton.addEventListener('click', () => {
    chatBox.innerHTML = '';
  });
});
</script>

</body>
</html>
