<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANT TOGETHER - 회원가입</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <!-- ANT TOGETHER 로고 이미지 -->
    <img src="{{ url_for('static', filename='images/ant-icon.png') }}" alt="ANT TOGETHER" class="logo-image">
    
    <h2 class="signup-title">회원가입</h2>
    
    <!-- Flash 메시지 표시 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    
    <form method="POST">
      <div class="input-box">
        <i class="fas fa-user"></i>
        <input type="text" name="username" placeholder="아이디 (4-20자)" 
               value="{{ form_data.username if form_data else '' }}" required>
      </div>
      
      <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" name="password" placeholder="비밀번호 (8자 이상, 영문+숫자+특수문자)" required>
      </div>
      
      <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" name="password_confirm" placeholder="비밀번호 확인" required>
      </div>
      
      <div class="input-box">
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" placeholder="이메일 주소" 
               value="{{ form_data.email if form_data else '' }}" required>
      </div>
      
      <div class="input-box">
        <i class="fas fa-phone"></i>
        <input type="tel" name="phone" placeholder="전화번호 (010-0000-0000)" 
               value="{{ form_data.phone if form_data else '' }}" 
               pattern="01[0-9]-\d{4}-\d{4}" required>
      </div>
      
      <div class="gender-box">
        <label class="gender-label">성별:</label>
        <div class="gender-options">
          <label class="gender-option">
            <input type="radio" name="gender" value="M" 
                   {{ 'checked' if form_data and form_data.gender == 'M' else '' }} required>
            <span>남성</span>
          </label>
          <label class="gender-option">
            <input type="radio" name="gender" value="F" 
                   {{ 'checked' if form_data and form_data.gender == 'F' else '' }} required>
            <span>여성</span>
          </label>
        </div>
      </div>
      
      <button type="submit" class="btn signup-btn">회원가입</button>
      
      <div class="login-link">
        <a href="{{ url_for('auth.login') }}">이미 계정이 있으신가요? 로그인</a>
      </div>
    </form>
  </div>
  
  <style>
    .signup-title {
      color: #fff;
      font-size: 1.8rem;
      margin: 10px 0 20px;
      font-weight: bold;
      text-align: center;
    }
    
    .flash-messages {
      margin: 10px 0;
      width: 90%;
    }
    
    .flash-message {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* 입력박스 둥글게 */
    .container .input-box {
      border-radius: 50px;
      margin-bottom: 12px;
    }
    
    .gender-box {
      background: #ffffff;
      border-radius: 50px;
      padding: 15px 20px;
      margin-bottom: 15px;
      width: 85%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .gender-label {
      color: #000;
      font-weight: bold;
      margin-right: 20px;
    }
    
    .gender-options {
      display: flex;
      gap: 20px;
    }
    
    .gender-option {
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    
    .gender-option input[type="radio"] {
      margin-right: 5px;
    }
    
    .signup-btn {
      background: #fff;
      color: #000;
      border: none;
      width: 35%; /* login.html과 동일한 크기 */
      padding: 12px;
      border-radius: 50px;
      font-weight: bold;
      margin: 15px auto 20px; /* auto로 중앙 정렬 */
      cursor: pointer;
      font-size: 1rem;
      display: block; /* 중앙 정렬을 위해 필요 */
      text-align: center;
    }
    
    .signup-btn:hover {
      background: #f0f0f0;
    }
    
    .login-link {
      margin-top: 20px;
      text-align: center;
    }
    
    .login-link a {
      color: #fff;
      text-decoration: underline;
      font-size: 0.9rem;
    }
  </style>
</body>
</html>
