<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANT TOGETHER - 아이디 찾기</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <!-- ANT TOGETHER 로고 이미지 (로그인 페이지와 동일한 클래스명 사용) -->
    <img src="{{ url_for('static', filename='images/ant-icon.png') }}" alt="ANT TOGETHER" class="logo-image">
    
    <h2 class="page-title">아이디 찾기</h2>
    <p class="page-info">가입시 등록한 이메일 주소를 입력해주세요.</p>
    
    <!-- Flash 메시지 표시 -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-messages">
          {% for message in messages %}
            <div class="flash-message">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    
    <form method="POST">
      <div class="input-box">
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" placeholder="이메일 주소" required>
      </div>
      
      <button type="submit" class="btn login-btn find-id-btn">아이디 찾기</button>
    </form>
    
    <div class="options">
      <a href="{{ url_for('auth.login') }}">로그인</a>
      <span style="margin: 0 5px;">|</span>
      <a href="{{ url_for('auth.find_password') }}">비밀번호 찾기</a>
      <span style="margin: 0 5px;">|</span>
      <a href="{{ url_for('auth.signup') }}">회원가입</a>
    </div>
  </div>
  
  <style>
    .page-title {
      color: #fff;
      font-size: 1.8rem;
      margin: 20px 0 10px;
      font-weight: bold;
      text-align: center;
    }
    
    .page-info {
      color: #aaa;
      font-size: 0.9rem;
      text-align: center;
      margin-bottom: 30px;
      line-height: 1.4;
    }
    
    .flash-messages {
      margin: 10px 0;
      width: 90%;
    }
    
    .flash-message {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 10px;
      border-radius: 15px;
      margin-bottom: 10px;
      font-size: 0.9rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    /* 아이디 찾기 버튼을 완전히 둥글게 */
    .find-id-btn {
      border-radius: 50px !important;
      width: 50% !important;
    }
    
    /* 입력박스도 더 둥글게 */
    .container .input-box {
      border-radius: 50px;
    }
  </style>
</body>
</html>
