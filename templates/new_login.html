<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANT TOGETHER - 회원가입</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/new_login_style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="signup-container">
    <!-- 상단 헤더 -->
    <div class="header">
      <span class="title">회원가입</span>
      <a href="{{ url_for('auth.login') }}" class="close-button">✕</a>
    </div>
    
    <!-- ANT TOGETHER 로고 이미지 (login.html과 완전히 동일하게) -->
    <img src="/static/images/ant-icon.png" alt="ANT TOGETHER" class="logo-image">
    
    <div class="social-buttons">
      <button class="social-btn naver">
        <img src="{{ url_for('static', filename='images/naver_outline.png') }}" alt="네이버">
        <span>네이버 계정으로 가입하기</span>
      </button>
      
      <button class="social-btn kakao">
        <img src="{{ url_for('static', filename='images/kakao_outline.png') }}" alt="카카오">
        <span>카카오 계정으로 가입하기</span>
      </button>
      
      <button class="social-btn google">
        <img src="{{ url_for('static', filename='images/google_outline.png') }}" alt="구글">
        <span>google 계정으로 가입하기</span>
      </button>
      
      <button class="social-btn apple">
        <img src="{{ url_for('static', filename='images/apple_outline.png') }}" alt="애플">
        <span>Apple로 계속</span>
      </button>
    </div>
    
    <div class="divider">또는</div>
    <div class="hr-line"></div>
    
    <a href="{{ url_for('auth.signup_form') }}" class="default-signup">일반 가입하기</a>
  </div>
</body>
</html>
