<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANT TOGETHER - 캘린더</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_calendar_style.css') }}">
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="left-icons">
                <span class="menu-icon">☰</span>
            </div>
            <button class="main-button">Main page</button>
        </div>
        
        <div class="date-display">
            <div class="text-icon">
                <span class="year-text">2025</span>
                <img src="{{ url_for('static', filename='images/under_tab.png') }}" alt="dropdown" class="dropdown-icon">
            </div>
            <div class="text-icon">
                <span class="year-text">8</span>
                <img src="{{ url_for('static', filename='images/under_tab.png') }}" alt="dropdown" class="dropdown-icon">
            </div>
        </div>
        
        <div class="navigation">
            <span class="arrow left">‹</span>
            <span class="arrow right">›</span>
        </div>
        
        <div class="weekdays">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>
        
        <div class="days-grid">
            <div class="day inactive">27</div>
            <div class="day inactive">28</div>
            <div class="day inactive">29</div>
            <div class="day inactive">30</div>
            <div class="day inactive">31</div>
            <div class="day">1</div>
            <div class="day">2</div>
            
            <div class="day today">3</div>
            <div class="day">4</div>
            <div class="day">5</div>
            <div class="day">6</div>
            <div class="day">7</div>
            <div class="day">8</div>
            <div class="day">9</div>
            
            <div class="day">10</div>
            <div class="day">11</div>
            <div class="day">12</div>
            <div class="day">13</div>
            <div class="day">14</div>
            <div class="day">15</div>
            <div class="day">16</div>
            
            <div class="day">17</div>
            <div class="day">18</div>
            <div class="day">19</div>
            <div class="day">20</div>
            <div class="day">21</div>
            <div class="day">22</div>
            <div class="day">23</div>
            
            <div class="day">24</div>
            <div class="day">25</div>
            <div class="day">26</div>
            <div class="day">27</div>
            <div class="day">28</div>
            <div class="day">29</div>
            <div class="day">30</div>
            
            <div class="day">31</div>
            <div class="day inactive">1</div>
            <div class="day inactive">2</div>
            <div class="day inactive">3</div>
            <div class="day inactive">4</div>
            <div class="day inactive">5</div>
            <div class="day inactive">6</div>
        </div>
    </div>

    <!-- 팝업 오버레이 -->
    <div class="overlay" id="overlay"></div>
    
    <!-- 년/월 선택 팝업 -->
    <div class="popup" id="popup">
        <h3>날짜 선택</h3>
        <div class="picker">
            <select id="yearSelect"></select>
            <select id="monthSelect"></select>
            <button onclick="closePopup()">확인</button>
        </div>
    </div>

    <!-- 일정 추가 팝업 -->
    <div class="schedule-overlay" id="scheduleOverlay"></div>
    <div class="schedule-popup" id="schedulePopup">
        <div class="popup-header">
            <span class="close-btn" onclick="closeSchedulePopup()">×</span>
            <span class="check-btn" onclick="saveSchedule()">✓</span>
        </div>
        <div class="popup-content">
            <button class="color-button">일정</button>
            <div class="add-item">
                <span class="circle">○</span> 새 항목 추가
            </div>
            <div class="input-row">
                <input type="text" id="scheduleInput" placeholder="일정을 입력하세요...">
                <button class="plus-btn">+</button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</html>
