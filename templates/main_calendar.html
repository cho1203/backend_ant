<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANT TOGETHER - 캘린더</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_calendar_style.css') }}">
</head>
<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <div class="left-icons">
                <span class="menu-icon">☰</span>
            </div>
            <button class="main-button">Main page</button>
        </div>
        
        <div class="date-display">
            <div class="text-icon" onclick="openPicker()">
                <span id="year" class="year-text">2025</span>
                <img src="{{ url_for('static', filename='images/under_tab.png') }}" alt="dropdown" class="dropdown-icon">
            </div>
            <div class="text-icon" onclick="openPicker()">
                <span id="month" class="year-text">8</span>
                <img src="{{ url_for('static', filename='images/under_tab.png') }}" alt="dropdown" class="dropdown-icon">
            </div>
        </div>
        
        <div class="navigation">
            <span class="arrow left" onclick="changeMonth(-1)">‹</span>
            <span class="arrow right" onclick="changeMonth(1)">›</span>
        </div>
        
        <div class="weekdays">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>
        
        <!-- 중요: ID 추가하고 내용 비우기 -->
        <div id="daysGrid" class="days-grid">
            <!-- JavaScript가 여기에 날짜들을 동적으로 생성합니다 -->
        </div>
    </div>

    <!-- 팝업 오버레이 -->
    <div class="overlay" id="overlay" onclick="closePicker()"></div>
    
    <!-- 년/월 선택 팝업 -->
    <div class="popup" id="popup">
        <h3>날짜 선택</h3>
        <div class="picker">
            <select id="yearSelect"></select>
            <select id="monthSelect"></select>
            <button onclick="applyPicker()">확인</button>
        </div>
    </div>

    <!-- 일정 추가 팝업 -->
    <div class="schedule-overlay" id="scheduleOverlay" onclick="closeSchedulePopup()"></div>
    <div class="schedule-popup" id="schedulePopup">
        <div class="popup-header">
            <span class="close-btn" onclick="closeSchedulePopup()">×</span>
            <span id="popupDateText">날짜</span>
            <span class="check-btn" id="saveScheduleBtn">✓</span>
        </div>
        <div class="popup-content">
            <input type="text" id="titleInput" placeholder="일정 제목" class="form-control">
            
            <select id="colorSelect" class="form-control">
                <option value="#2196f3">파랑</option>
                <option value="#4caf50">초록</option>
                <option value="#ff9800">주황</option>
                <option value="#f44336">빨강</option>
            </select>
            
            <input type="time" id="alarmTime" class="form-control">
            <input type="text" id="scheduleInput" placeholder="일정 내용..." class="form-control">
            
            <ul id="scheduleList" class="schedule-list"></ul>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
</body>
</html>
